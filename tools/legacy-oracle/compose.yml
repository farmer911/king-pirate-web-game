# Legacy server alone, as a local test oracle for recording. Ports are bound to 127.0.0.1 only.
# For playing, use the root docker-compose.yml (Rust front + this backend).
services:
  legacy:
    image: kp-legacy-oracle
    container_name: kp-legacy-oracle
    ports:
      - "127.0.0.1:18002:8002"
      - "127.0.0.1:18080:80"
    ulimits:
      nofile: 65535
