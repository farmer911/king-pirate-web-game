# Play: docker compose up -d   then open http://<host>:8081
#
# Bridge setup: the Rust server serves the portal and the Flash client and forwards game connections
# to the legacy game server (clean container, tools/legacy-oracle/), which is not exposed itself.
# Needs, once per machine (see GEMINI.md "Commands"):
#   - client-assets/ (Flash client, built portal, Ruffle)
#   - the kp-legacy-oracle image (tools/legacy-oracle/stage.sh + docker build)
services:
  app:
    build: .
    image: king-pirate
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8003:8003"
      - "8002:8002"
    environment:
      KING_PIRATE_UPSTREAM: legacy:8002
    volumes:
      - ./client-assets:/app/client-assets:ro
      - app-data:/app/data
    depends_on:
      - legacy

  legacy:
    image: kp-legacy-oracle
    restart: unless-stopped
    volumes:
      - legacy-db:/home/pirate/programs/mysql/var
    ulimits:
      nofile: 65535

volumes:
  app-data:
  legacy-db:
